<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Guilloche Engrave Text Effect Maker</title>
    
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    <style>
        /* Editorial Theme Palette with Automatic Light/Dark Mode */
        :root {
            --bg-color: #f7f5f0;
            --panel-bg: var(--bg-color);
            --text-primary: #121212;
            --text-muted: #736e65;
            --accent: #121212;
            --border-color: rgba(18, 18, 18, 0.12);
            --canvas-bg: #ffffff;
            --checker-1: #efece6;
            --checker-2: #ffffff;
            --input-underline: #121212;
            --font-editorial: 'Instrument Serif', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d0d0d;
                --panel-bg: var(--bg-color);
                --text-primary: #f0eee9;
                --text-muted: #8c877e;
                --accent: #f0eee9;
                --border-color: rgba(240, 238, 233, 0.15);
                --canvas-bg: #141414;
                --checker-1: #1a1a1a;
                --checker-2: #101010;
                --input-underline: #f0eee9;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-mono);
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 24px;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Semantic Header */
        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 40px;
        }

        .logo-link {
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        nav a {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        /* App Layout */
        .app-layout {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 50px;
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            padding: 0;
            margin-bottom: 60px;
        }

        @media (max-width: 950px) {
            .app-layout {
                grid-template-columns: 1fr;
                gap: 35px;
            }
        }

        /* Canvas Container */
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 1;
            background-color: var(--canvas-bg);
            background-image: conic-gradient(var(--checker-1) 0.25turn, var(--checker-2) 0.25turn 0.5turn, var(--checker-1) 0.5turn 0.75turn, var(--checker-2) 0.75turn);
            background-size: 20px 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 28px;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .text-input-wrapper {
            position: relative;
        }

        .text-input {
            width: 100%;
            font-size: 2.2rem;
            padding: 8px 0;
            border: none;
            border-bottom: 1px solid var(--input-underline);
            outline: none;
            background: transparent;
            font-family: var(--font-editorial);
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: 0.01em;
            resize: vertical;
            min-height: 56px;
            line-height: 1.1;
        }

        .text-input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
            font-style: italic;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .label-with-icon {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .label-icon {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            flex-shrink: 0;
            opacity: 0.8;
        }

        .value-display {
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        .value-display[contenteditable="true"] {
            cursor: text;
            outline: none;
            border-bottom: 1px dashed var(--text-muted);
            min-width: 36px;
            display: inline-block;
            text-align: right;
            transition: border-bottom-color 0.2s ease;
        }

        .value-display[contenteditable="true"]:focus {
            border-bottom-color: var(--accent);
        }

        /* Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 1px;
            background: var(--border-color);
            outline: none;
            margin: 12px 0 6px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.4);
        }

        /* Advanced Options */
        details.advanced-options {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: 4px;
        }

        details.advanced-options summary {
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-family: var(--font-mono);
        }

        details.advanced-options summary::-webkit-details-marker {
            display: none;
        }

        details.advanced-options summary::after {
            content: "＋";
            font-size: 0.75rem;
            font-weight: 300;
        }

        details.advanced-options[open] summary::after {
            content: "－";
        }

        .advanced-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 18px;
            padding-top: 20px;
        }

        .color-selector {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            gap: 10px;
            background: transparent;
            justify-content: space-between;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 22px;
            height: 22px;
            cursor: pointer;
            background: none;
            border-radius: 50%;
            overflow: hidden;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border-color);
            border-radius: 50%;
        }

        .export-dropdown, .btn-custom-font {
            width: 100%;
            padding: 8px 0;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            border: none;
            border-bottom: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            text-align: left;
            box-sizing: border-box;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 0;
        }
        
        .export-dropdown:focus, .btn-custom-font:hover {
            border-color: var(--text-primary);
        }

        /* Download Button */
        .btn-download {
            background: var(--text-primary);
            color: var(--bg-color);
            border: none;
            padding: 14px 20px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 2px;
        }

        .btn-download:hover {
            opacity: 0.88;
        }

        .btn-download:active {
            transform: scale(0.99);
        }
        
        .btn-download:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        footer {
            width: 100%;
            max-width: 1100px;
            padding: 20px 0;
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header role="banner">
        <a href="https://callistra.design" class="logo-link">Callistra.design</a>
    </header>

    <main role="main">
        <div class="app-layout">
            <div class="canvas-container">
                <canvas id="canvas" width="800" height="400" aria-label="Typography preview canvas showcasing guilloche engraved text effects"></canvas>
            </div>

            <div class="control-panel">
                <div class="controls-group">
                    <div class="text-input-wrapper">
                        <textarea id="textInput" class="text-input" placeholder="TYPE SOMETHING..." aria-label="Guilloche Engrave Text Input Source" rows="2">GUILLOCHE</textarea>
                    </div>

                    <div id="mainSliders"></div>

                    <details class="advanced-options">
                        <summary>Color and Size</summary>
                        <div class="advanced-grid">
                            <div id="advSliders" style="display: contents;"></div>

                            <div class="control-row">
                                <div class="control-header">
                                    <label for="textColor" class="label-with-icon">
                                        <svg class="label-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg>
                                        Color
                                    </label>
                                </div>
                                <div class="color-selector">
                                    <input type="color" id="textColor" value="#000000">
                                    <span id="v_color" class="value-display" contenteditable="true" style="font-size: 0.75rem;">#000000</span>
                                </div>
                            </div>

                            <div class="control-row">
                                <div class="control-header">
                                    <label class="label-with-icon">
                                        <svg class="label-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                                        Custom Font
                                    </label>
                                </div>
                                <label for="fontInput" class="btn-custom-font" id="fontLabel">Upload Font</label>
                                <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2" style="display: none;">
                            </div>

                            <div class="control-row">
                                <div class="control-header">
                                    <label for="exportScale" class="label-with-icon">
                                        <svg class="label-icon" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                                        Export Size
                                    </label>
                                </div>
                                <select id="exportScale" class="export-dropdown">
                                    <option value="1">1x</option>
                                    <option value="2">2x</option>
                                    <option value="4" selected>4x</option>
                                    <option value="8">8x</option>
                                </select>
                            </div>
                        </div>
                    </details>
                </div>

                <div>
                    <button class="btn-download" id="btnDownload">
                        <svg class="label-icon" style="width: 15px; height: 15px;" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        DOWNLOAD PNG
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer role="contentinfo"></footer>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const DEFAULT_FONT = '"Archivo Black", "Arial Black", sans-serif';
        let customFontFamily = DEFAULT_FONT;

        // Slider config: id, label, min, max, step, value, suffix, icon path, group
        const SLIDERS = [
            { id: 'pitch',  label: 'Line Pitch',  min: 2,  max: 16, step: 0.5, value: 4,   suffix: 'px', main: true, icon: 'M3 5h18M3 10h18M3 15h18M3 20h18' },
            { id: 'depth',  label: 'Wave Depth',  min: 0,  max: 70, step: 1,   value: 12,  suffix: 'px', main: true, icon: 'M2 12c3-8 5-8 8 0s5 8 8 0 3-4 4-4' },
            { id: 'cycles', label: 'Wave Cycles', min: 1,  max: 24, step: 0.5, value: 3,   suffix: '',   main: true, icon: 'M2 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0' },
            { id: 'twist',  label: 'Twist',       min: 0,  max: 2,  step: 0.05,value: 0.35,suffix: '',   main: true, icon: 'M4 4c8 0 8 8 16 8M4 12c8 0 8 8 16 8' },
            { id: 'outline',label: 'Outline',     min: 0,  max: 8,  step: 0.5, value: 2,   suffix: 'px', main: true, icon: 'M5 5h14v14H5z' },
            { id: 'weight', label: 'Line Weight', min: 0.3,max: 3,  step: 0.1, value: 0.9, suffix: 'px', main: false, icon: 'M4 12h16' },
            { id: 'weave',  label: 'Weave',       min: 0,  max: 1,  step: 0.05,value: 1,   suffix: '',   main: false, icon: 'M4 4l16 16M20 4L4 20' },
            { id: 'fontSize',label:'Size',        min: 30, max: 260,step: 1,   value: 150, suffix: 'px', main: false, icon: 'M4 7V4h16v3M9 20h6M12 4v16' }
        ];

        function buildSliders() {
            SLIDERS.forEach(c => {
                const row = document.createElement('div');
                row.className = 'control-row';
                row.innerHTML = `
                    <div class="control-header">
                        <label for="${c.id}" class="label-with-icon">
                            <svg class="label-icon" viewBox="0 0 24 24"><path d="${c.icon}"/></svg>
                            ${c.label}
                        </label>
                        <span id="v_${c.id}" class="value-display" contenteditable="true">${c.value}${c.suffix}</span>
                    </div>
                    <input type="range" id="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}">`;
                const host = document.getElementById(c.main ? 'mainSliders' : 'advSliders');
                if (c.main) {
                    row.style.marginBottom = '24px';
                }
                host.appendChild(row);

                const input = row.querySelector('input');
                const span = row.querySelector('.value-display');
                input.addEventListener('input', draw);
                span.addEventListener('input', () => {
                    const v = parseFloat(span.innerText.replace(/[^0-9.-]/g, ''));
                    if (!isNaN(v)) { input.value = v; draw(); }
                });
                span.addEventListener('blur', () => { span.innerText = input.value + c.suffix; });
            });
            document.getElementById('mainSliders').style.cssText = 'display:flex;flex-direction:column;';
            document.getElementById('mainSliders').lastElementChild.style.marginBottom = '0';
        }

        function initThemeColor() {
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const c = isDark ? '#FFFFFF' : '#000000';
            document.getElementById('textColor').value = c;
            document.getElementById('v_color').innerText = c;
        }

        function bindColor() {
            const input = document.getElementById('textColor');
            const span = document.getElementById('v_color');
            input.addEventListener('input', () => {
                if (document.activeElement !== span) span.innerText = input.value.toUpperCase();
                draw();
            });
            span.addEventListener('input', () => {
                let val = span.innerText.trim();
                if (!val.startsWith('#')) val = '#' + val;
                if (/^#([0-9A-Fa-f]{3})$/.test(val)) val = '#' + val[1] + val[1] + val[2] + val[2] + val[3] + val[3];
                if (/^#([0-9A-Fa-f]{6})$/.test(val)) { input.value = val; draw(); }
            });
            span.addEventListener('blur', () => { span.innerText = input.value.toUpperCase(); });
        }

        function bindFont() {
            document.getElementById('fontInput').addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const fontName = 'CustomFont_' + Date.now();
                    const font = new FontFace(fontName, e.target.result);
                    font.load().then((loaded) => {
                        document.fonts.add(loaded);
                        customFontFamily = `"${fontName}", ${DEFAULT_FONT}`;
                        document.getElementById('fontLabel').innerText = file.name;
                        draw();
                    }).catch((err) => {
                        console.error('Error loading custom font:', err);
                        alert('Could not load custom font file.');
                    });
                };
                reader.readAsArrayBuffer(file);
            });
        }

        let renderPending = false;
        function draw() {
            if (renderPending) return;
            renderPending = true;
            requestAnimationFrame(() => {
                try { renderToCanvas(ctx, canvas.width, canvas.height, 1); }
                finally { renderPending = false; }
            });
        }

        function val(id) { return parseFloat(document.getElementById(id).value); }

        function renderToCanvas(targetCtx, W, H, scale) {
            const text = document.getElementById('textInput').value;
            const pitch = Math.max(1, val('pitch')) * scale;
            const depth = val('depth') * scale;
            const cycles = val('cycles');
            const twist = val('twist');
            const outline = val('outline') * scale;
            const weight = val('weight') * scale;
            const weave = val('weave');
            const userSize = val('fontSize');
            const color = document.getElementById('textColor').value;

            if (scale === 1) {
                SLIDERS.forEach(c => {
                    const span = document.getElementById('v_' + c.id);
                    if (document.activeElement !== span) span.innerText = document.getElementById(c.id).value + c.suffix;
                });
                const cs = document.getElementById('v_color');
                if (document.activeElement !== cs) cs.innerText = color.toUpperCase();
            }

            targetCtx.clearRect(0, 0, W, H);
            if (!text.trim()) return null;

            // Step 1: lay out text into a mask buffer
            const mask = document.createElement('canvas');
            mask.width = W; mask.height = H;
            const mctx = mask.getContext('2d');

            const lines = text.split('\n');
            const padding = 40 * scale + outline * 2;
            const refSize = 100 * scale;
            mctx.font = `400 ${refSize}px ${customFontFamily}`;
            let maxRefWidth = 1;
            lines.forEach(l => { maxRefWidth = Math.max(maxRefWidth, mctx.measureText(l).width); });
            const refTotalHeight = lines.length * refSize * 1.1;
            const fitW = (Math.max(10 * scale, W - padding) * refSize) / maxRefWidth;
            const fitH = (Math.max(10 * scale, H - padding) * refSize) / refTotalHeight;
            const fontSize = Math.max(10 * scale, Math.min(userSize * scale, fitW, fitH));

            mctx.font = `400 ${fontSize}px ${customFontFamily}`;
            mctx.textAlign = 'center';
            mctx.textBaseline = 'middle';
            mctx.fillStyle = '#000';
            const lineHeight = fontSize * 1.1;
            const startY = H / 2 - (lines.length * lineHeight) / 2 + lineHeight / 2;
            lines.forEach((l, i) => mctx.fillText(l, W / 2, startY + i * lineHeight));

            // Step 2: tight bounding box of the glyphs
            const md = mctx.getImageData(0, 0, W, H);
            const mb = new Uint32Array(md.data.buffer);
            let minX = W, minY = H, maxX = 0, maxY = 0, has = false;
            for (let y = 0; y < H; y++) {
                const row = y * W;
                for (let x = 0; x < W; x++) {
                    if (mb[row + x] !== 0) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                        has = true;
                    }
                }
            }
            if (!has) return null;

            // Step 3: engrave interlaced sine ribbons on a layer
            const layer = document.createElement('canvas');
            layer.width = W; layer.height = H;
            const lctx = layer.getContext('2d');
            lctx.strokeStyle = color;
            lctx.lineWidth = weight;
            lctx.lineJoin = 'round';

            const w = Math.max(1, maxX - minX);
            const k = (Math.PI * 2 * cycles) / w;
            const xStep = Math.max(1, Math.round(2 * scale));
            const top = minY - depth - pitch;
            const bottom = maxY + depth + pitch;
            const count = Math.ceil((bottom - top) / pitch);

            function family(sign, alpha) {
                lctx.globalAlpha = alpha;
                for (let i = 0; i <= count; i++) {
                    const y0 = top + i * pitch;
                    const ph = sign * i * twist;
                    lctx.beginPath();
                    for (let x = minX - xStep; x <= maxX + xStep; x += xStep) {
                        const y = y0 + Math.sin((x - minX) * k + ph) * depth;
                        if (x === minX - xStep) lctx.moveTo(x, y); else lctx.lineTo(x, y);
                    }
                    lctx.stroke();
                }
            }
            family(1, 1);
            if (weave > 0) family(-1, weave);
            lctx.globalAlpha = 1;

            // Step 4: clip engraving to the letterforms
            lctx.globalCompositeOperation = 'destination-in';
            lctx.drawImage(mask, 0, 0);

            targetCtx.drawImage(layer, 0, 0);

            // Step 5: crisp engraved outline around the letters
            if (outline > 0) {
                targetCtx.save();
                targetCtx.font = `400 ${fontSize}px ${customFontFamily}`;
                targetCtx.textAlign = 'center';
                targetCtx.textBaseline = 'middle';
                targetCtx.strokeStyle = color;
                targetCtx.lineWidth = outline;
                targetCtx.lineJoin = 'round';
                lines.forEach((l, i) => targetCtx.strokeText(l, W / 2, startY + i * lineHeight));
                targetCtx.restore();
            }

            return scale === 1 ? null : targetCtx.getImageData(0, 0, W, H);
        }

        function downloadPNG() {
            const btn = document.getElementById('btnDownload');
            const origHTML = btn.innerHTML;
            btn.innerText = 'RENDERING...';
            btn.disabled = true;

            setTimeout(() => {
                try {
                    const scale = parseInt(document.getElementById('exportScale').value) || 4;
                    const W = 800 * scale, H = 400 * scale;
                    const tmp = document.createElement('canvas');
                    tmp.width = W; tmp.height = H;
                    const tctx = tmp.getContext('2d');
                    const data = renderToCanvas(tctx, W, H, scale);
                    if (!data) { alert('No text to download.'); return; }

                    const buf = new Uint32Array(data.data.buffer);
                    let minX = W, minY = H, maxX = 0, maxY = 0, has = false;
                    for (let y = 0; y < H; y++) {
                        const row = y * W;
                        for (let x = 0; x < W; x++) {
                            if (buf[row + x] !== 0) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                                has = true;
                            }
                        }
                    }
                    if (!has) { alert('No text to download.'); return; }

                    const cw = maxX - minX + 1, ch = maxY - minY + 1;
                    const crop = document.createElement('canvas');
                    crop.width = cw; crop.height = ch;
                    crop.getContext('2d').drawImage(tmp, minX, minY, cw, ch, 0, 0, cw, ch);

                    const link = document.createElement('a');
                    link.download = `guilloche-engrave-${scale}x.png`;
                    link.href = crop.toDataURL('image/png');
                    link.click();
                } catch (err) {
                    console.error('Render failed:', err);
                    alert('An error occurred during export.');
                } finally {
                    btn.innerHTML = origHTML;
                    btn.disabled = false;
                }
            }, 50);
        }

        buildSliders();
        bindColor();
        bindFont();
        initThemeColor();
        document.getElementById('textInput').addEventListener('input', draw);
        document.getElementById('btnDownload').addEventListener('click', downloadPNG);

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                initThemeColor();
                draw();
            });
        }

        draw();
        Promise.all([
            document.fonts.load('400 100px "Archivo Black"'),
            document.fonts.ready
        ]).then(draw).catch(draw);
    </script>
</body>
</html>
