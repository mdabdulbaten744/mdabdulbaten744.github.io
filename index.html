<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Liquid Chrome Text Effect Maker</title>
    
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    <style>
        /* Editorial Theme Palette with Automatic Light/Dark Mode */
        :root {
            --bg-color: #f7f5f0;
            --panel-bg: var(--bg-color);
            --text-primary: #121212;
            --text-muted: #736e65;
            --accent: #121212;
            --border-color: rgba(18, 18, 18, 0.12);
            --canvas-bg: #ffffff;
            --checker-1: #efece6;
            --checker-2: #ffffff;
            --input-underline: #121212;
            --font-editorial: 'Barlow Condensed', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d0d0d;
                --panel-bg: var(--bg-color);
                --text-primary: #f0eee9;
                --text-muted: #8c877e;
                --accent: #f0eee9;
                --border-color: rgba(240, 238, 233, 0.15);
                --canvas-bg: #141414;
                --checker-1: #1a1a1a;
                --checker-2: #101010;
                --input-underline: #f0eee9;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-mono);
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 24px;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Semantic Header */
        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 40px;
        }

        .logo-link {
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        nav a {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        /* App Layout */
        .app-layout {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 50px;
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            padding: 0;
            margin-bottom: 60px;
        }

        @media (max-width: 950px) {
            .app-layout {
                grid-template-columns: 1fr;
                gap: 35px;
            }
        }

        /* Canvas Container with Transparent Checkerboard Preview */
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 1;
            background-color: var(--canvas-bg);
            background-image: conic-gradient(var(--checker-1) 0.25turn, var(--checker-2) 0.25turn 0.5turn, var(--checker-1) 0.5turn 0.75turn, var(--checker-2) 0.75turn);
            background-size: 20px 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 28px;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .text-input-wrapper {
            position: relative;
        }

        .text-input {
            width: 100%;
            font-size: 2.2rem;
            padding: 8px 0;
            border: none;
            border-bottom: 1px solid var(--input-underline);
            outline: none;
            background: transparent;
            font-family: var(--font-editorial);
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: 0.01em;
            resize: vertical;
            min-height: 56px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .text-input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
            font-style: italic;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .label-with-icon {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .label-icon {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            flex-shrink: 0;
            opacity: 0.8;
        }

        .value-display {
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        .value-display[contenteditable="true"] {
            cursor: text;
            outline: none;
            border-bottom: 1px dashed var(--text-muted);
            min-width: 36px;
            display: inline-block;
            text-align: right;
            transition: border-bottom-color 0.2s ease;
        }

        .value-display[contenteditable="true"]:focus {
            border-bottom-color: var(--accent);
        }

        /* Minimalistic Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 1px;
            background: var(--border-color);
            outline: none;
            margin: 12px 0 6px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.4);
        }

        /* Advanced Options */
        details.advanced-options {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: 4px;
        }

        details.advanced-options summary {
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-family: var(--font-mono);
        }

        details.advanced-options summary::-webkit-details-marker {
            display: none;
        }

        details.advanced-options summary::after {
            content: "＋";
            font-size: 0.75rem;
            font-weight: 300;
        }

        details.advanced-options[open] summary::after {
            content: "－";
        }

        .advanced-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 18px;
            padding-top: 20px;
        }

        .color-selector {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            gap: 10px;
            background: transparent;
            justify-content: space-between;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 22px;
            height: 22px;
            cursor: pointer;
            background: none;
            border-radius: 50%;
            overflow: hidden;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border-color);
            border-radius: 50%;
        }

        .export-dropdown, .btn-custom-font {
            width: 100%;
            padding: 8px 0;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            border: none;
            border-bottom: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            text-align: left;
            box-sizing: border-box;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 0;
        }
        
        .export-dropdown:focus, .btn-custom-font:hover {
            border-color: var(--text-primary);
        }

        /* Download Button */
        .btn-download {
            background: var(--text-primary);
            color: var(--bg-color);
            border: none;
            padding: 14px 20px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 2px;
        }

        .btn-download:hover {
            opacity: 0.88;
        }

        .btn-download:active {
            transform: scale(0.99);
        }
        
        .btn-download:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        footer {
            width: 100%;
            max-width: 1100px;
            padding: 20px 0;
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header role="banner">
        <a href="https://callistra.design" class="logo-link">Callistra.design</a>
    </header>

    <main role="main">
        <div class="app-layout">
            <div class="canvas-container">
                <canvas id="canvas" width="800" height="400" aria-label="Typography preview canvas showcasing liquid chrome metallic effects"></canvas>
            </div>

            <div class="control-panel">
                <div class="controls-group">
                    <div class="text-input-wrapper">
                        <textarea id="textInput" class="text-input" placeholder="TYPE SOMETHING..." oninput="draw()" aria-label="Chrome Text Input Source" rows="2">CHROME</textarea>
                    </div>

                    <div class="control-row">
                        <div class="control-header">
                            <label for="bevelDepth" class="label-with-icon">
                                <svg class="label-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                                Bevel Depth
                            </label>
                            <span id="v_bevelDepth" class="value-display" contenteditable="true" oninput="updateFromText('bevelDepth')" onblur="handleBlur('bevelDepth', 'px')">20px</span>
                        </div>
                        <input type="range" id="bevelDepth" min="4" max="40" step="1" value="20" oninput="draw()">
                    </div>

                    <div class="control-row">
                        <div class="control-header">
                            <label for="liquidFlow" class="label-with-icon">
                                <svg class="label-icon" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                                Liquid Melt
                            </label>
                            <span id="v_liquidFlow" class="value-display" contenteditable="true" oninput="updateFromText('liquidFlow')" onblur="handleBlur('liquidFlow', '%')">50%</span>
                        </div>
                        <input type="range" id="liquidFlow" min="0" max="100" step="1" value="50" oninput="draw()">
                    </div>

                    <div class="control-row">
                        <div class="control-header">
                            <label for="iridescence" class="label-with-icon">
                                <svg class="label-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20M2 12h20"/></svg>
                                Rainbow Sheen
                            </label>
                            <span id="v_iridescence" class="value-display" contenteditable="true" oninput="updateFromText('iridescence')" onblur="handleBlur('iridescence', '%')">65%</span>
                        </div>
                        <input type="range" id="iridescence" min="0" max="100" step="1" value="65" oninput="draw()">
                    </div>

                    <div class="control-row">
                        <div class="control-header">
                            <label for="reflection" class="label-with-icon">
                                <svg class="label-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                                Gloss & Contrast
                            </label>
                            <span id="v_reflection" class="value-display" contenteditable="true" oninput="updateFromText('reflection')" onblur="handleBlur('reflection', '%')">80%</span>
                        </div>
                        <input type="range" id="reflection" min="20" max="100" step="1" value="80" oninput="draw()">
                    </div>

                    <details class="advanced-options">
                        <summary>Color and Size</summary>
                        <div class="advanced-grid">
                            <div class="control-row">
                                <div class="control-header">
                                    <label for="fontSize" class="label-with-icon">
                                        <svg class="label-icon" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
                                        Size
                                    </label>
                                    <span id="v_fontSize" class="value-display" contenteditable="true" oninput="updateFromText('fontSize')" onblur="handleBlur('fontSize', 'px')">140px</span>
                                </div>
                                <input type="range" id="fontSize" min="30" max="250" value="140" oninput="draw()">
                            </div>

                            <div class="control-row">
                                <div class="control-header">
                                    <label for="textColor" class="label-with-icon">
                                        <svg class="label-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg>
                                        Color
                                    </label>
                                </div>
                                <div class="color-selector">
                                    <input type="color" id="textColor" value="#000000" oninput="updateColorLabel(this.value)">
                                    <span id="v_color" class="value-display" contenteditable="true" style="font-size: 0.75rem;" oninput="updateFromColorText()" onblur="handleColorBlur()">#000000</span>
                                </div>
                            </div>

                            <div class="control-row">
                                <div class="control-header">
                                    <label class="label-with-icon">
                                        <svg class="label-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                                        Custom Font
                                    </label>
                                </div>
                                <label for="fontInput" class="btn-custom-font" id="fontLabel">Upload Font</label>
                                <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2" onchange="handleFontUpload(event)" style="display: none;">
                            </div>

                            <div class="control-row">
                                <div class="control-header">
                                    <label for="exportScale" class="label-with-icon">
                                        <svg class="label-icon" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                                        Export Size
                                    </label>
                                </div>
                                <select id="exportScale" class="export-dropdown">
                                    <option value="1">1x</option>
                                    <option value="2">2x</option>
                                    <option value="4" selected>4x</option>
                                    <option value="8">8x</option>
                                </select>
                            </div>
                        </div>
                    </details>
                </div>

                <div>
                    <button class="btn-download" onclick="downloadPNG()">
                        <svg class="label-icon" style="width: 15px; height: 15px;" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        DOWNLOAD PNG
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer role="contentinfo"></footer>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let customFontFamily = '"Barlow Condensed", serif';

        function initThemeColor() {
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const defaultColor = isDark ? '#FFFFFF' : '#000000';
            const textColorInput = document.getElementById('textColor');
            const colorSpan = document.getElementById('v_color');
            if (textColorInput && colorSpan) {
                textColorInput.value = defaultColor;
                colorSpan.innerText = defaultColor;
            }
        }

        function handleFontUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const fontName = 'CustomFont_' + Date.now();
                const font = new FontFace(fontName, e.target.result);
                font.load().then(function(loadedFont) {
                    document.fonts.add(loadedFont);
                    customFontFamily = `"${fontName}", "Barlow Condensed", serif`;
                    const label = document.getElementById('fontLabel');
                    if (label) label.innerText = file.name;
                    draw();
                }).catch(function(err) {
                    console.error("Error loading custom font:", err);
                    alert("Could not load custom font file.");
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function updateColorLabel(colorVal) {
            const span = document.getElementById('v_color');
            if (document.activeElement !== span) {
                span.innerText = colorVal.toUpperCase();
            }
            draw();
        }

        function updateFromColorText() {
            const span = document.getElementById('v_color');
            const input = document.getElementById('textColor');
            let val = span.innerText.trim();
            if (!val.startsWith('#')) {
                val = '#' + val;
            }
            if (/^#([0-9A-Fa-f]{3})$/.test(val)) {
                val = '#' + val[1] + val[1] + val[2] + val[2] + val[3] + val[3];
            }
            if (/^#([0-9A-Fa-f]{6})$/.test(val)) {
                input.value = val;
                draw();
            }
        }

        function handleColorBlur() {
            const span = document.getElementById('v_color');
            const input = document.getElementById('textColor');
            span.innerText = input.value.toUpperCase();
        }

        function updateFromText(id) {
            const span = document.getElementById('v_' + id);
            const input = document.getElementById(id);
            let val = parseInt(span.innerText.replace(/[^0-9-]/g, ''));
            if (!isNaN(val)) {
                input.value = val;
                draw();
            }
        }
        
        function handleBlur(id, suffix = 'px') {
            const span = document.getElementById('v_' + id);
            const input = document.getElementById(id);
            span.innerText = input.value + suffix;
        }

        function hexToRgb(hex) {
            let c = hex.replace('#', '');
            if (c.length === 3) {
                c = c.split('').map(x => x + x).join('');
            }
            const num = parseInt(c, 16);
            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            };
        }

        function hsvToRgb(h, s, v) {
            h = ((h % 1) + 1) % 1;
            const i = Math.floor(h * 6), f = h * 6 - i;
            const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: return [v, t, p];
                case 1: return [q, v, p];
                case 2: return [p, v, t];
                case 3: return [p, q, v];
                case 4: return [t, p, v];
                default: return [v, p, q];
            }
        }

        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
            let h = 0;
            if (d > 0) {
                if (max === r) h = ((g - b) / d) % 6;
                else if (max === g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h /= 6;
                if (h < 0) h += 1;
            }
            return [h, max === 0 ? 0 : d / max, max];
        }

        // --- Multi-Octave Spatial Noise for Molten Undulation ---
        function hash2D(x, y) {
            let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
            return n - Math.floor(n);
        }

        function smoothNoise(x, y) {
            const i = Math.floor(x);
            const j = Math.floor(y);
            const fx = x - i;
            const fy = y - j;
            const sx = fx * fx * (3 - 2 * fx);
            const sy = fy * fy * (3 - 2 * fy);

            const n00 = hash2D(i, j);
            const n10 = hash2D(i + 1, j);
            const n01 = hash2D(i, j + 1);
            const n11 = hash2D(i + 1, j + 1);

            const top = n00 + sx * (n10 - n00);
            const bottom = n01 + sx * (n11 - n01);
            return top + sy * (bottom - top);
        }

        function fbm(x, y) {
            let total = 0;
            let amp = 0.55;
            let freq = 1.0;
            for (let k = 0; k < 3; k++) {
                total += smoothNoise(x * freq, y * freq) * amp;
                freq *= 2.05;
                amp *= 0.5;
            }
            return total;
        }

        // --- Exact Linear-Time 2D Euclidean Distance Transform ---
        function computeEuclideanDistanceTransform(mask, W, H, maxDist) {
            const INF = 1e8;
            const distSq = new Float32Array(W * H);
            
            // Pass 1: Column-wise distance
            for (let x = 0; x < W; x++) {
                let d = INF;
                for (let y = 0; y < H; y++) {
                    const idx = y * W + x;
                    d = mask[idx] ? 0 : d + 1;
                    distSq[idx] = d * d;
                }
                d = INF;
                for (let y = H - 1; y >= 0; y--) {
                    const idx = y * W + x;
                    d = mask[idx] ? 0 : d + 1;
                    distSq[idx] = Math.min(distSq[idx], d * d);
                }
            }

            // Pass 2: Row-wise parabolic envelope
            const s = new Int32Array(W);
            const t = new Int32Array(W);
            const finalDist = new Float32Array(W * H);
            const maxDSq = maxDist * maxDist;

            for (let y = 0; y < H; y++) {
                const rowOffset = y * W;
                let q = 0;
                s[0] = 0;
                t[0] = 0;

                for (let u = 1; u < W; u++) {
                    while (q >= 0) {
                        const v = s[q];
                        const fv = distSq[rowOffset + v];
                        const fu = distSq[rowOffset + u];
                        const sep = Math.floor((fu - fv + u * u - v * v) / (2 * (u - v)));
                        if (sep <= t[q]) {
                            q--;
                        } else {
                            if (sep < W) {
                                q++;
                                s[q] = u;
                                t[q] = sep;
                            }
                            break;
                        }
                    }
                    if (q < 0) {
                        q = 0;
                        s[0] = u;
                        t[0] = 0;
                    }
                }

                for (let u = W - 1; u >= 0; u--) {
                    const v = s[q];
                    const d = (u - v) * (u - v) + distSq[rowOffset + v];
                    finalDist[rowOffset + u] = Math.sqrt(Math.min(maxDSq, d));
                    if (u === t[q] && q > 0) q--;
                }
            }

            return finalDist;
        }

        let renderPending = false;

        function draw() {
            if (!renderPending) {
                renderPending = true;
                requestAnimationFrame(() => {
                    try {
                        performDraw();
                    } finally {
                        renderPending = false;
                    }
                });
            }
        }

        function performDraw() {
            renderToCanvas(ctx, canvas.width, canvas.height, 1);
        }

        function renderToCanvas(targetCtx, targetWidth, targetHeight, scale) {
            const text = document.getElementById('textInput').value;
            
            let origBevelDepth = parseInt(document.getElementById('bevelDepth').value);
            if (isNaN(origBevelDepth) || origBevelDepth < 2) origBevelDepth = 2;

            const origLiquidFlow = parseInt(document.getElementById('liquidFlow').value) / 100;
            const origIridescence = parseInt(document.getElementById('iridescence').value) / 100;
            const origReflection = parseInt(document.getElementById('reflection').value) / 100;
            const origFontSize = parseInt(document.getElementById('fontSize').value);
            const textColor = document.getElementById('textColor').value;

            if (scale === 1) {
                if (document.activeElement !== document.getElementById('v_bevelDepth')) {
                    document.getElementById('v_bevelDepth').innerText = origBevelDepth + 'px';
                }
                if (document.activeElement !== document.getElementById('v_liquidFlow')) {
                    document.getElementById('v_liquidFlow').innerText = Math.round(origLiquidFlow * 100) + '%';
                }
                if (document.activeElement !== document.getElementById('v_iridescence')) {
                    document.getElementById('v_iridescence').innerText = Math.round(origIridescence * 100) + '%';
                }
                if (document.activeElement !== document.getElementById('v_reflection')) {
                    document.getElementById('v_reflection').innerText = Math.round(origReflection * 100) + '%';
                }
                if (document.activeElement !== document.getElementById('v_fontSize')) {
                    document.getElementById('v_fontSize').innerText = origFontSize + 'px';
                }
                if (document.activeElement !== document.getElementById('v_color')) {
                    document.getElementById('v_color').innerText = textColor.toUpperCase();
                }
            }

            // Always maintain a strictly transparent background for the canvas
            targetCtx.clearRect(0, 0, targetWidth, targetHeight);
            
            if (!text.trim()) return null;

            // Render crisp typography mask offscreen
            const offscreen = document.createElement('canvas');
            offscreen.width = targetWidth;
            offscreen.height = targetHeight;
            const octx = offscreen.getContext('2d');

            const lines = text.split('\n');
            const padding = 45 * scale;

            const refSize = 100 * scale;
            octx.font = `900 ${refSize}px ${customFontFamily}`;
            let maxRefWidth = 1;
            lines.forEach(line => {
                let width = octx.measureText(line).width;
                if (width > maxRefWidth) maxRefWidth = width;
            });

            const refTotalHeight = lines.length * (refSize * 1.05);
            const availWidth = Math.max(10 * scale, targetWidth - padding);
            const availHeight = Math.max(10 * scale, targetHeight - padding);

            const maxFontSizeW = (availWidth * refSize) / maxRefWidth;
            const maxFontSizeH = (availHeight * refSize) / refTotalHeight;
            const calculatedMaxFontSize = Math.min(maxFontSizeW, maxFontSizeH);
            const scaledFontSize = Math.max(10 * scale, Math.min(origFontSize * scale, calculatedMaxFontSize));

            octx.font = `900 ${scaledFontSize}px ${customFontFamily}`;
            octx.textAlign = 'center';
            octx.textBaseline = 'middle';
            octx.fillStyle = '#FFFFFF';

            const lineHeight = scaledFontSize * 1.05;
            const totalHeight = lines.length * lineHeight;
            let startY = (targetHeight / 2) - (totalHeight / 2) + (lineHeight / 2);

            lines.forEach((line, index) => {
                octx.fillText(line, targetWidth / 2, startY + (index * lineHeight));
            });

            // Extract binary text silhouette mask
            const maskImg = octx.getImageData(0, 0, targetWidth, targetHeight);
            const maskData = maskImg.data;
            const mask = new Uint8Array(targetWidth * targetHeight);
            for (let i = 0, p = 3; i < mask.length; i++, p += 4) {
                mask[i] = maskData[p] > 110 ? 1 : 0;
            }

            // Calculate Euclidean distance transform to inflate the 3D chrome dome
            const maxRadius = Math.max(4, origBevelDepth * scale);
            const distMap = computeEuclideanDistanceTransform(mask, targetWidth, targetHeight, maxRadius);

            // Compute Heightmap with Molten Ripples & Curvature
            const heightMap = new Float32Array(targetWidth * targetHeight);
            const noiseScale = 0.016 / scale;
            const meltDistortion = origLiquidFlow * (14.0 * scale);

            for (let y = 0; y < targetHeight; y++) {
                const row = y * targetWidth;
                for (let x = 0; x < targetWidth; x++) {
                    const idx = row + x;
                    const d = distMap[idx];

                    if (d > 0) {
                        const normD = Math.min(1.0, d / maxRadius);
                        let elevation = Math.sqrt(Math.max(0, 1.0 - Math.pow(1.0 - normD, 2.0)));

                        if (meltDistortion > 0) {
                            const wave = fbm(x * noiseScale, y * noiseScale);
                            const ripple = Math.sin(wave * Math.PI * 4 + normD * 3.0) * 0.18;
                            elevation = Math.max(0.05, Math.min(1.0, elevation + ripple * origLiquidFlow));
                        }

                        heightMap[idx] = elevation;
                    }
                }
            }

            // User-Chosen Color Attributes
            const userRgb = hexToRgb(textColor);
            const userHsv = rgbToHsv(userRgb.r, userRgb.g, userRgb.b);
            const isDark = userHsv[2] < 0.12;
            const isWhite = userHsv[1] < 0.08 && userHsv[2] > 0.92;
            const isNeutral = isDark || isWhite || userHsv[1] < 0.08;
            const baseHue = userHsv[0];
            const vividSat = Math.max(userHsv[1], 0.75);

            // Shading & Environment Ray-Reflection Mapping
            const targetData = targetCtx.createImageData(targetWidth, targetHeight);
            const outPixels = targetData.data;

            for (let y = 1; y < targetHeight - 1; y++) {
                const row = y * targetWidth;
                for (let x = 1; x < targetWidth - 1; x++) {
                    const idx = row + x;

                    if (mask[idx]) {
                        // Central difference gradient for surface normal
                        const dzdx = (heightMap[idx + 1] - heightMap[idx - 1]) * 1.8;
                        const dzdy = (heightMap[idx + targetWidth] - heightMap[idx - targetWidth]) * 1.8;
                        const nz = 0.45;

                        const len = Math.sqrt(dzdx * dzdx + dzdy * dzdy + nz * nz) || 1.0;
                        const nx = -dzdx / len;
                        const ny = -dzdy / len;
                        const normZ = nz / len;

                        // Ray reflection vector components: R = 2*(N.V)*N - V
                        const refX = 2 * nx * normZ;
                        const refY = 2 * ny * normZ;
                        const theta = Math.atan2(refY, refX);
                        const rho = Math.min(1.0, Math.sqrt(refX * refX + refY * refY));
                        const normAngle = (theta + Math.PI) / (Math.PI * 2);

                        // High contrast studio chrome horizon & light lobes
                        const horizon = Math.sin(refY * Math.PI * 3.2 + Math.cos(refX * Math.PI * 2.2));
                        const chromeLobe = Math.pow(Math.max(0, 0.5 + 0.5 * horizon), 2.2);
                        const topLight = Math.pow(Math.max(0, refY * 0.65 + refX * 0.35 + 0.5), 2.5);

                        // Base metallic core luminance
                        let coreLuminance = 45 + chromeLobe * 160 + topLight * 150;
                        coreLuminance = Math.min(255, coreLuminance * origReflection);

                        // Normalised luminance of the lighting (0..1)
                        const L = coreLuminance / 255;
                        const edgeMask = 0.45 + (1.0 - normZ) * 0.55;

                        // Rainbow parameter (same field as before)
                        const wave1 = Math.sin(normAngle * Math.PI * 4 + refY * 2.8);
                        const wave2 = Math.cos(rho * Math.PI * 3.2 - refX * 1.6);
                        const t = 0.5 + 0.5 * (wave1 * 0.6 + wave2 * 0.4);

                        let r, g, b;
                        if (isNeutral) {
                            // White / black / gray picks: polished metal + VIVID spectral sheen
                            if (isWhite) {
                                r = coreLuminance; g = coreLuminance * 0.98; b = coreLuminance * 1.02;
                            } else {
                                const darkBody = 25 + chromeLobe * 60 + topLight * 180;
                                r = darkBody * 0.95; g = darkBody * 0.98; b = darkBody * 1.05;
                            }
                            if (origIridescence > 0) {
                                const spec = hsvToRgb(t * 1.2, 0.9, 0.4 + 0.6 * Math.min(1, L + 0.2));
                                const k = Math.min(1, origIridescence * edgeMask * 1.15);
                                r = r * (1 - k) + spec[0] * 255 * k;
                                g = g * (1 - k) + spec[1] * 255 * k;
                                b = b * (1 - k) + spec[2] * 255 * k;
                            }
                        } else {
                            // Coloured chrome: keep the chosen hue fully saturated.
                            // Shadows go toward deep colour (never gray), highlights toward white.
                            const hue = baseHue + (t - 0.5) * (300 / 360) * origIridescence * edgeMask;
                            const pure = hsvToRgb(hue, vividSat, 1.0);
                            let k;
                            if (L < 0.5) {
                                k = 0.12 + 0.88 * (L / 0.5);
                                r = pure[0] * k * 255; g = pure[1] * k * 255; b = pure[2] * k * 255;
                            } else {
                                const w = Math.min(1, (L - 0.5) / 0.5);
                                const mixW = w * w * 0.7;
                                r = (pure[0] * (1 - mixW) + mixW) * 255;
                                g = (pure[1] * (1 - mixW) + mixW) * 255;
                                b = (pure[2] * (1 - mixW) + mixW) * 255;
                            }
                            // Tinted fresnel rim (adds colour, not gray)
                            const fres = Math.pow(Math.max(0, 1.0 - normZ), 2.2);
                            const rim = fres * 0.45 * origReflection;
                            r += pure[0] * 255 * rim; g += pure[1] * 255 * rim; b += pure[2] * 255 * rim;
                        }

                        // Specular glint (blend toward white, narrow so colour stays vivid)
                        const specLobe = Math.min(1, Math.pow(Math.max(0, -refX * 0.45 - refY * 0.7 + 0.6), 8.0) * (origReflection * 1.4));
                        r += (255 - r) * specLobe;
                        g += (255 - g) * specLobe;
                        b += (255 - b) * specLobe;

                        if (isNeutral) {
                            const fresnel = Math.pow(Math.max(0, 1.0 - normZ), 2.2);
                            const rimGlow = fresnel * 120 * origReflection;
                            r += rimGlow; g += rimGlow * 1.05; b += rimGlow * 1.15;
                        }

                        // Edge Alpha Anti-Aliasing (seamless anti-aliased edge over transparent background)
                        const d = distMap[idx];
                        let alpha = 255;
                        if (d < 1.4) {
                            alpha = Math.floor(Math.max(0, Math.min(255, (d / 1.4) * 255)));
                        }

                        const p = idx * 4;
                        outPixels[p] = Math.min(255, Math.max(0, r));
                        outPixels[p + 1] = Math.min(255, Math.max(0, g));
                        outPixels[p + 2] = Math.min(255, Math.max(0, b));
                        outPixels[p + 3] = alpha;
                    }
                }
            }

            targetCtx.putImageData(targetData, 0, 0);
            return targetData;
        }

        // --- Exact Pixel-Bounding-Box Export to Transparent PNG ---
        function downloadPNG() {
            const btn = document.querySelector('.btn-download');
            const origText = btn.innerHTML;
            btn.innerText = "RENDERING...";
            btn.disabled = true;

            setTimeout(() => {
                try {
                    const scale = parseInt(document.getElementById('exportScale').value) || 4; 
                    const targetWidth = 800 * scale; 
                    const targetHeight = 400 * scale; 

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = targetWidth;
                    tempCanvas.height = targetHeight;
                    const tempCtx = tempCanvas.getContext('2d');

                    const targetData = renderToCanvas(tempCtx, targetWidth, targetHeight, scale);

                    if (!targetData) {
                        btn.innerHTML = origText;
                        btn.disabled = false;
                        return;
                    }

                    const buffer = new Uint32Array(targetData.data.buffer);
                    let minX = targetWidth, minY = targetHeight, maxX = 0, maxY = 0;
                    let hasPixels = false;

                    for (let y = 0; y < targetHeight; y++) {
                        const rowOffset = y * targetWidth;
                        for (let x = 0; x < targetWidth; x++) {
                            if (buffer[rowOffset + x] !== 0) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                                hasPixels = true;
                            }
                        }
                    }

                    if (!hasPixels) {
                        alert("No text to download.");
                        btn.innerHTML = origText;
                        btn.disabled = false;
                        return;
                    }

                    const cropW = maxX - minX + 1;
                    const cropH = maxY - minY + 1;

                    const cropCanvas = document.createElement('canvas');
                    cropCanvas.width = cropW;
                    cropCanvas.height = cropH;
                    const cropCtx = cropCanvas.getContext('2d');
                    
                    const cropData = cropCtx.createImageData(cropW, cropH);
                    const cropBuffer = new Uint32Array(cropData.data.buffer);
                    
                    for (let y = 0; y < cropH; y++) {
                        const srcRow = (y + minY) * targetWidth;
                        const dstRow = y * cropW;
                        for (let x = 0; x < cropW; x++) {
                            cropBuffer[dstRow + x] = buffer[srcRow + (x + minX)];
                        }
                    }
                    cropCtx.putImageData(cropData, 0, 0);

                    const link = document.createElement('a');
                    link.download = `liquid-chrome-${scale}x.png`;
                    link.href = cropCanvas.toDataURL('image/png');
                    link.click();

                } catch (err) {
                    console.error("Render failed:", err);
                    alert("An error occurred during export.");
                } finally {
                    btn.innerHTML = origText;
                    btn.disabled = false;
                }
            }, 50);
        }

        initThemeColor();

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                initThemeColor();
                draw();
            });
        }

        document.fonts.ready.then(() => {
            draw();
        });
    </script>
</body>
</html>
